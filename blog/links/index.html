<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友链 | Haruko386</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div id="progress-bar"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="../">Haruko386 の blog</a>
      <button class="navbar-toggle" id="navToggle"><span></span><span></span><span></span></button>
      <div class="navbar-links" id="navLinks">
        <a href="../../">首页</a><a href="../">博客</a><a href="../archives/">归档</a><a href="../categories/">分类</a><a href="../tags/">标签</a><a href="../about/">关于</a><a href="../links/">友链</a>
        <button class="navbar-icon" id="themeToggle">&#x1F31F;</button>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top:6rem;">
    <h1 style="text-align:center;margin-bottom:2rem;">友情链接</h1>
    <div class="links-grid" id="linksGrid"></div>
  </main>

  <button id="scroll-top">&#x2191;</button>
  <footer class="blog-footer"><p>Powered by vanilla HTML / CSS / JS</p></footer>

  <script>
    document.getElementById('navToggle').onclick=function(){document.getElementById('navLinks').classList.toggle('open')};
    window.addEventListener('scroll',function(){document.getElementById('progress-bar').style.width=(window.scrollY/(document.documentElement.scrollHeight-window.innerHeight)*100)+'%';document.getElementById('scroll-top').classList.toggle('visible',window.scrollY>400)});
    document.getElementById('scroll-top').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
    (function(){var t=document.getElementById('themeToggle'),s=localStorage.getItem('blog-theme'),d=s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');t.onclick=function(){var i=document.documentElement.getAttribute('data-theme')==='dark';if(i){document.documentElement.removeAttribute('data-theme');localStorage.setItem('blog-theme','light')}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('blog-theme','dark')}}})();

    var links = [
      { name: 'dianhsuのblog', url: 'https://www.dianhsu.com/', desc: 'Fluid 主题参考来源', avatar: '' },
      { name: 'GitHub', url: 'https://github.com/Haruko386', desc: 'Haruko386 on GitHub', avatar: '' }
    ];

    document.getElementById('linksGrid').innerHTML = links.map(function(l){
      return '<a class="link-card" href="'+l.url+'" target="_blank" rel="noopener">'
        + '<div class="link-card-info"><div class="link-name">'+l.name+'</div><div class="link-desc">'+l.desc+'</div></div></a>';
    }).join('');
  </script>
</body>
</html>
