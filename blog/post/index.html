<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 | Haruko386</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div id="progress-bar"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="../">Haruko386 の blog</a>
      <button class="navbar-toggle" id="navToggle"><span></span><span></span><span></span></button>
      <div class="navbar-links" id="navLinks" style="display:flex;">
        <a href="../../">首页</a><a href="../">博客</a><a href="../archives/">归档</a><a href="../categories/">分类</a><a href="../tags/">标签</a><a href="../about/">关于</a><a href="../links/">友链</a>
        <button class="navbar-icon" id="themeToggle">&#x1F31F;</button>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top:6rem;">
    <div id="postHeaderContent"></div>
    <div class="post-layout">
      <div class="post-body-wrap">
        <article class="post-body" id="postBody">
          <p style="text-align:center;color:var(--muted);padding:2rem 0;">加载中...</p>
        </article>
      </div>
      <nav id="toc" aria-label="文章目录"></nav>
    </div>
  </main>

  <button id="scroll-top">&#x2191;</button>
  <footer class="blog-footer"><p>Powered by vanilla HTML / CSS / JS</p></footer>

  <script>
    document.getElementById('navToggle').onclick=function(){document.getElementById('navLinks').classList.toggle('open')};
    window.addEventListener('scroll',function(){document.getElementById('progress-bar').style.width=(window.scrollY/(document.documentElement.scrollHeight-window.innerHeight)*100)+'%';document.getElementById('scroll-top').classList.toggle('visible',window.scrollY>400)});
    document.getElementById('scroll-top').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
    (function(){var t=document.getElementById('themeToggle'),s=localStorage.getItem('blog-theme'),d=s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');t.onclick=function(){var i=document.documentElement.getAttribute('data-theme')==='dark';if(i){document.documentElement.removeAttribute('data-theme');localStorage.setItem('blog-theme','light')}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('blog-theme','dark')}}})();

    (function () {
      var params = new URLSearchParams(location.search);
      var slug = params.get('p');
      if (!slug || !/^[a-zA-Z0-9_-]+$/.test(slug)) {
        document.getElementById('postBody').innerHTML = '<p style="text-align:center;color:var(--muted);padding:2rem 0;">缺少文章参数。</p>';
        document.title = '未找到 | Haruko386';
        return;
      }

      var mdPath = '../posts/' + slug + '.md';

      fetch('../posts.json')
        .then(function (r) { return r.json(); })
        .then(function (posts) {
          var meta = (posts||[]).find(function (p) { return p.slug === slug; });
          if (meta) {
            document.title = meta.title + ' | Haruko386';
            document.getElementById('postHeaderContent').innerHTML =
              '<div class="post-header">'
              + '<h1 class="post-title">' + meta.title + '</h1>'
              + '<div class="post-meta">'
              + (meta.date ? meta.date + ' &nbsp; ' : '')
              + (meta.categories||[]).join(' / ')
              + '</div>'
              + '<div style="margin-top:0.6rem;">'
              + (meta.tags||[]).map(function (t) { return '<a class="meta-tag" href="../tags/?t=' + encodeURIComponent(t) + '">#' + t + '</a>'; }).join(' ')
              + '</div></div>';
          } else {
            document.title = slug + ' | Haruko386';
          }
        });

      fetch(mdPath)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (md) {
          document.getElementById('postBody').innerHTML = marked.parse(md);
          buildTOC();
        })
        .catch(function (e) {
          document.getElementById('postBody').innerHTML = '<p style="text-align:center;color:var(--muted);padding:2rem 0;">无法加载文章：' + e.message + '</p>';
        });

      function buildTOC() {
        var toc = document.getElementById('toc');
        var headings = document.getElementById('postBody').querySelectorAll('h2, h3');
        if (headings.length < 2) { toc.innerHTML = ''; return; }
        var html = '';
        headings.forEach(function (h, i) {
          var id = 'heading-' + i;
          h.id = id;
          var cls = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
          html += '<a class="' + cls + '" href="#' + id + '">' + h.textContent + '</a>';
        });
        toc.innerHTML = html;

        // highlight active heading on scroll
        var links = toc.querySelectorAll('a');
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var id = entry.target.id;
            var link = toc.querySelector('a[href="#' + id + '"]');
            if (link) link.classList.toggle('active', entry.isIntersecting);
          });
        }, { rootMargin: '-60px 0px -80% 0px' });
        headings.forEach(function (h) { observer.observe(h); });
      }
    })();
  </script>

</body>
</html>
